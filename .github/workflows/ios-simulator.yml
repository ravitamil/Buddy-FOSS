name: iOS Simulator Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/**
      - src/**
      - packages/buddy-ui/**
      - app.config.ts
      - package.json
      - pnpm-lock.yaml

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm buddy-ui:check
      - run: pnpm exec expo prebuild --platform ios --no-install
      - run: npx pod-install ios
      - name: Build Buddy for the iOS simulator
        run: >-
          xcodebuild
          -workspace ios/Buddy.xcworkspace
          -scheme Buddy
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/buddy-derived-data"
          CODE_SIGNING_ALLOWED=NO
          build
