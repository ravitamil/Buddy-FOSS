name: Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Run TypeScript type checking
      run: npm run type-check
      
    - name: Check code formatting
      run: npm run format:check
      
    - name: Run tests
      run: npm run test -- --coverage --watchAll=false
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.node-version == '20.x'
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        
    - name: Run comprehensive quality check
      run: npm run quality-check
      
    - name: Check bundle size
      run: |
        npm run build || echo "Build not available, skipping bundle size check"
        
    - name: Security audit
      run: npm audit --audit-level moderate
      
    - name: Check for outdated dependencies
      run: npm outdated || true
      
  performance-tests:
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run performance tests
      run: |
        if [ -f "src/__tests__/performance" ]; then
          npm run test -- --testPathPattern=performance --watchAll=false
        else
          echo "No performance tests found, skipping"
        fi
        
    - name: Bundle size analysis
      run: |
        if command -v du >/dev/null 2>&1; then
          echo "Node modules size: $(du -sh node_modules | cut -f1)"
        fi
        
  code-quality-metrics:
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate code quality report
      run: |
        echo "## Code Quality Metrics" > quality-report.md
        echo "" >> quality-report.md
        
        echo "### ESLint Results" >> quality-report.md
        npm run lint -- --format json > eslint-results.json || true
        if [ -f eslint-results.json ]; then
          echo "ESLint results generated" >> quality-report.md
        fi
        
        echo "### TypeScript Results" >> quality-report.md
        npm run type-check > typescript-results.txt 2>&1 || true
        if [ -f typescript-results.txt ]; then
          echo "TypeScript check completed" >> quality-report.md
        fi
        
        echo "### Test Coverage" >> quality-report.md
        npm run test:coverage -- --watchAll=false > coverage-results.txt 2>&1 || true
        if [ -f coverage-results.txt ]; then
          echo "Test coverage generated" >> quality-report.md
        fi
        
    - name: Upload quality report
      uses: actions/upload-artifact@v3
      with:
        name: quality-report
        path: |
          quality-report.md
          eslint-results.json
          typescript-results.txt
          coverage-results.txt
          coverage/
        retention-days: 30